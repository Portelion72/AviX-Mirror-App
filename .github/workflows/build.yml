name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version à publier (ex. v1.0.0) ; vide = simple build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (exe unique, autonome)
        run: >
          dotnet publish src/AviXMirror/AviXMirror.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o publish

      - name: Copier la notice et l'app Assetto Corsa
        run: |
          Copy-Item README.md publish/LISEZMOI.md
          New-Item -ItemType Directory -Force publish/AssettoCorsa-app-CSP | Out-Null
          Copy-Item -Recurse integrations/AssettoCorsa/AviXMirror publish/AssettoCorsa-app-CSP/

      - uses: actions/upload-artifact@v4
        with:
          name: AviXMirror-win-x64
          path: publish/

      - name: Zip pour la release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        run: Compress-Archive -Path publish/* -DestinationPath AviXMirror-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        uses: softprops/action-gh-release@v2
        with:
          # Lancement manuel : crée le tag sur le commit construit.
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: AviX Mirror ${{ inputs.release || github.ref_name }}
          generate_release_notes: true
          files: AviXMirror-win-x64.zip
